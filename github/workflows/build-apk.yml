name: Construir APK TerraTech
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir zip
        run: |
          if [ ! -d www ] && ls *.zip 1>/dev/null 2>&1; then
            Z=$(ls -t *.zip | head -1); unzip -o -q "$Z" -d _zip
            SRC=$(dirname "$(find _zip -name capacitor.config.json | head -1)")
            cp -a "$SRC"/. .
          fi
          test -f capacitor.config.json || { echo "Falta el proyecto"; exit 1; }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm install --no-audit --no-fund
      - run: rm -rf android && npx cap add android
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --splashBackgroundColor '#ffffff' || true
      - name: Permisos cámara y GPS
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n</manifest>#' $M
      - run: npx cap sync android
      - working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TerraTech-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
